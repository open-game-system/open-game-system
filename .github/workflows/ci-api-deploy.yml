name: API Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/ci-api-deploy.yml"

concurrency:
  group: api-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter=@open-game-system/api...

      - name: Run tests
        run: pnpm --filter @open-game-system/api test

      - name: Apply schema migration
        run: |
          npx wrangler d1 execute "opengame-api-db" \
            --file=services/api/schema.sql \
            --remote

      - name: Deploy to production
        working-directory: services/api
        run: npx wrangler deploy

      # The cast renderer is the Cloud Run GPU stream server (stream-gpu, us-east4), set by hand with
      # `wrangler secret put STREAM_SERVER_URL`; this only overwrites it when the repo variable
      # STREAM_SERVER_URL is set. (It used to force bun-stream-server, a March Worker with no GPU.)
      # TURN: the GPU publisher on Cloud Run has only private addresses and reaches the SFU through
      # a TURN relay, as the PR previews do.
      - name: Set secrets
        working-directory: services/api
        env:
          STREAM_SERVER_URL: ${{ vars.STREAM_SERVER_URL }}
          TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
          TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
        run: |
          if [ -n "$STREAM_SERVER_URL" ]; then printf '%s' "$STREAM_SERVER_URL" | npx wrangler secret put STREAM_SERVER_URL; fi
          if [ -n "$TURN_API_TOKEN" ]; then printf '%s' "$TURN_API_TOKEN" | npx wrangler secret put CLOUDFLARE_TURN_API_TOKEN; fi
          if [ -n "$TURN_KEY_ID" ]; then printf '%s' "$TURN_KEY_ID" | npx wrangler secret put CLOUDFLARE_TURN_KEY_ID; fi

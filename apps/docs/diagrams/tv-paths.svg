<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
<title id="title">Who renders the TV: the host iPhone for AirPlay, the Chromecast itself, or a browser on the TV</title>
<desc id="desc">AirPlay: the host iPhone draws the TV page and Screen Mirroring sends the picture. Chromecast: the phone sends a URL and the Chromecast draws it. Browser TV: paired by a code, the TV browser draws it.</desc>
<style>
svg{--bg:#f6f4ef;--paper:#fffdf9;--ink:#1b1a1f;--ink2:#5b5864;--line:#d9d4c8;--accent:#c2410c;--soft:#fdebe1;--cool:#e6eef0;--coolink:#1f5560}
@media (prefers-color-scheme: dark){svg{--bg:#131217;--paper:#1a1920;--ink:#ece9e2;--ink2:#a9a5b2;--line:#3a3743;--accent:#fb923c;--soft:#33221a;--cool:#17282c;--coolink:#8fd0dc}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.canvas{fill:var(--paper);stroke:var(--line);stroke-width:1}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.75}
.cool{fill:var(--cool);stroke:var(--coolink);stroke-width:1.5}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.h2{font-size:12px;font-weight:700;fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.t{font-size:13px;fill:var(--ink2)}
.tk{font-size:13px;fill:var(--ink)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--ink)}
.ma{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--accent);font-weight:600}
.lbl{font-size:12px;font-weight:600;fill:var(--accent);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}
.lna{stroke:var(--accent);stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 5}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:2 6;fill:none}
.ah{fill:var(--ink2)}
.aha{fill:var(--accent)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="579" rx="16"/>
<text class="h2" x="40" y="44">Who draws the picture</text>
<text class="h2" x="620" y="44">What the TV does</text>
<!-- row 1 airplay -->
<text class="h" x="40" y="86">Apple TV, through AirPlay</text>
<rect class="hot" x="40" y="100" width="330" height="96" rx="10"/>
<text class="tk" x="58" y="126">The host iPhone draws it</text>
<text class="t" x="58" y="148">a second, full-screen WebView on the</text>
<text class="t" x="58" y="166">external display iOS makes when you</text>
<text class="t" x="58" y="184">pick Screen Mirroring</text>
<path class="lna" d="M370 148 H620" marker-end="url(#b)"/>
<text class="lbl" x="495" y="140" text-anchor="middle">Screen Mirroring (video)</text>
<rect class="box" x="620" y="100" width="300" height="96" rx="10"/>
<text class="tk" x="638" y="126">Shows the phone's picture</text>
<text class="t" x="638" y="148">The phone keeps the controller.</text>
<text class="t" x="638" y="166">It stays in front and awake.</text>
<!-- row 2 chromecast -->
<text class="h" x="40" y="250">Chromecast</text>
<rect class="box" x="40" y="264" width="330" height="96" rx="10"/>
<text class="tk" x="58" y="290">The host phone sends the URL</text>
<text class="t" x="58" y="312">of the TV launcher (LOAD_VIEW)</text>
<text class="t" x="58" y="330">over Google Cast; nothing to draw</text>
<path class="lna" d="M370 312 H620" marker-end="url(#b)"/>
<text class="lbl" x="495" y="304" text-anchor="middle">Google Cast (a URL)</text>
<rect class="hot" x="620" y="264" width="300" height="96" rx="10"/>
<text class="tk" x="638" y="290">Draws it itself</text>
<text class="t" x="638" y="312">The OGS receiver runs the launcher</text>
<text class="t" x="638" y="330">and your TV page; light tier on</text>
<text class="t" x="638" y="348">weak models</text>
<!-- row 3 browser -->
<text class="h" x="40" y="414">Any TV or laptop with a browser</text>
<rect class="box" x="40" y="428" width="330" height="96" rx="10"/>
<text class="tk" x="58" y="454">A phone pairs by a code</text>
<text class="t" x="58" y="476">the TV page shows at ogs-tv.pages.dev;</text>
<text class="t" x="58" y="494">the OGS API hands it the launcher</text>
<path class="lna" d="M370 476 H620" marker-end="url(#b)"/>
<text class="lbl" x="495" y="468" text-anchor="middle">pairing code (a URL)</text>
<rect class="hot" x="620" y="428" width="300" height="96" rx="10"/>
<text class="tk" x="638" y="454">Draws it itself</text>
<text class="t" x="638" y="476">The TV's own browser runs the</text>
<text class="t" x="638" y="494">launcher and your TV page</text>
<text class="t" x="40" y="556">Highlighted: the device that renders your TV page. No cloud GPU and no server video stream on any path.</text>

</svg>

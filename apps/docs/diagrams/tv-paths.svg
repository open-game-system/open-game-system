<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Who renders the TV: always the host phone; AirPlay, Chromecast and Another screen only show the picture</title>
<desc id="desc">AirPlay: the phone draws on the external display. Chromecast and Another screen: the phone draws off-screen and streams WebRTC video peer to peer on the local network (in development).</desc>
<style>
svg{--bg:#f6f4ef;--paper:#fffdf9;--ink:#1b1a1f;--ink2:#5b5864;--line:#d9d4c8;--accent:#c2410c;--soft:#fdebe1;--cool:#e6eef0;--coolink:#1f5560}
@media (prefers-color-scheme: dark){svg{--bg:#131217;--paper:#1a1920;--ink:#ece9e2;--ink2:#a9a5b2;--line:#3a3743;--accent:#fb923c;--soft:#33221a;--cool:#17282c;--coolink:#8fd0dc}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.canvas{fill:var(--paper);stroke:var(--line);stroke-width:1}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.75}
.cool{fill:var(--cool);stroke:var(--coolink);stroke-width:1.5}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.h2{font-size:12px;font-weight:700;fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.t{font-size:13px;fill:var(--ink2)}
.tk{font-size:13px;fill:var(--ink)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--ink)}
.ma{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--accent);font-weight:600}
.lbl{font-size:12px;font-weight:600;fill:var(--accent);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}
.lna{stroke:var(--accent);stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 5}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:2 6;fill:none}
.ah{fill:var(--ink2)}
.aha{fill:var(--accent)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="599" rx="16"/>
<text class="h2" x="40" y="44">The host phone draws the picture</text>
<text class="h2" x="620" y="44">The TV only shows it</text>
<text class="h" x="40" y="86">Apple TV, through AirPlay</text>
<rect class="hot" x="40" y="100" width="330" height="96" rx="10"/>
<text class="tk" x="58" y="126">Draws on the external display</text>
<text class="t" x="58" y="148">a second WebView on the screen iOS</text>
<text class="t" x="58" y="166">makes when you pick Screen Mirroring</text>
<path class="lna" d="M370 148 H620" marker-end="url(#b)"/>
<text class="lbl" x="495" y="140" text-anchor="middle">Screen Mirroring</text>
<rect class="box" x="620" y="100" width="300" height="96" rx="10"/>
<text class="tk" x="638" y="126">Apple TV shows it</text>
<text class="t" x="638" y="148">Works today (OGS app and</text>
<text class="t" x="638" y="166">your app with cast.airplay)</text>
<text class="h" x="40" y="250">Chromecast</text>
<rect class="hot" x="40" y="264" width="330" height="96" rx="10"/>
<text class="tk" x="58" y="290">Draws off-screen, encodes video</text>
<text class="t" x="58" y="312">the same launcher and TV page, in a</text>
<text class="t" x="58" y="330">WebView no one sees on the phone</text>
<path class="lna dash" d="M370 312 H620" marker-end="url(#b)"/>
<text class="lbl" x="495" y="304" text-anchor="middle">WebRTC, peer to peer on Wi-Fi</text>
<rect class="box" x="620" y="264" width="300" height="96" rx="10"/>
<text class="tk" x="638" y="290">Chromecast plays the video</text>
<text class="t" x="638" y="312">The receiver only plays it.</text>
<text class="ma" x="638" y="338">In development</text>
<text class="h" x="40" y="414">Another screen (a smart TV browser or a laptop)</text>
<rect class="hot" x="40" y="428" width="330" height="96" rx="10"/>
<text class="tk" x="58" y="454">Draws off-screen, encodes video</text>
<text class="t" x="58" y="476">paired by a code: open a link on</text>
<text class="t" x="58" y="494">the screen, type its code on the phone</text>
<path class="lna dash" d="M370 476 H620" marker-end="url(#b)"/>
<text class="lbl" x="495" y="468" text-anchor="middle">WebRTC, peer to peer on Wi-Fi</text>
<rect class="box" x="620" y="428" width="300" height="96" rx="10"/>
<text class="tk" x="638" y="454">The browser plays the video</text>
<text class="t" x="638" y="476">The page only plays it.</text>
<text class="ma" x="638" y="502">In development</text>
<text class="t" x="40" y="566">Highlighted: where your TV page runs. No cloud rendering, and nothing renders on the TV.</text>

</svg>

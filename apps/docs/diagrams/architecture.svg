<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">OGS architecture: phones, the TV launcher with your TV page, your room server and the OGS API</title>
<desc id="desc">Phones run your phone page and the TV launcher frames your TV page; both talk to your own room server over WebSockets, and to the OGS API for profiles, the catalogue, the couch session and game tokens.</desc>
<style>
svg{--bg:#f6f4ef;--paper:#fffdf9;--ink:#1b1a1f;--ink2:#5b5864;--line:#d9d4c8;--accent:#c2410c;--soft:#fdebe1;--cool:#e6eef0;--coolink:#1f5560}
@media (prefers-color-scheme: dark){svg{--bg:#131217;--paper:#1a1920;--ink:#ece9e2;--ink2:#a9a5b2;--line:#3a3743;--accent:#fb923c;--soft:#33221a;--cool:#17282c;--coolink:#8fd0dc}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.canvas{fill:var(--paper);stroke:var(--line);stroke-width:1}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.75}
.cool{fill:var(--cool);stroke:var(--coolink);stroke-width:1.5}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.h2{font-size:12px;font-weight:700;fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.t{font-size:13px;fill:var(--ink2)}
.tk{font-size:13px;fill:var(--ink)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--ink)}
.ma{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--accent);font-weight:600}
.lbl{font-size:12px;font-weight:600;fill:var(--accent);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}
.lna{stroke:var(--accent);stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 5}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:2 6;fill:none}
.ah{fill:var(--ink2)}
.aha{fill:var(--accent)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="559" rx="16"/>
<text class="h2" x="40" y="44">In the living room</text>
<text class="h2" x="380" y="44">Your game's servers</text>
<text class="h2" x="690" y="44">OGS</text>
<!-- phones -->
<rect class="box" x="40" y="64" width="270" height="150" rx="12"/>
<text class="h" x="60" y="94">Phones and iPads</text>
<text class="t" x="60" y="118">The OGS app, or your own app</text>
<text class="t" x="60" y="136">built on @open-game-system/shell</text>
<rect class="hot" x="60" y="152" width="230" height="44" rx="8"/>
<text class="tk" x="76" y="179">Your phone page (WebView)</text>
<!-- tv -->
<rect class="box" x="40" y="290" width="270" height="230" rx="12"/>
<text class="h" x="60" y="320">The TV</text>
<text class="t" x="60" y="344">OGS TV launcher (one page per cast)</text>
<rect class="hot" x="60" y="362" width="230" height="64" rx="8"/>
<text class="tk" x="76" y="389">Your TV page</text>
<text class="t" x="76" y="409">in an iframe, 16:9</text>
<text class="t" x="60" y="454">Drawn on a device you own:</text>
<text class="tk" x="60" y="474">the host iPhone (AirPlay),</text>
<text class="tk" x="60" y="494">the Chromecast, or a TV browser</text>
<!-- room server -->
<rect class="cool" x="380" y="206" width="240" height="150" rx="12"/>
<text class="h" x="400" y="236">Your room server</text>
<text class="t" x="400" y="260">Cloudflare Worker</text>
<text class="t" x="400" y="278">one Durable Object per room</text>
<text class="t" x="400" y="296">game state, rules, WebSockets</text>
<text class="t" x="400" y="332">verifies OGS game tokens</text>
<!-- api -->
<rect class="box" x="690" y="64" width="240" height="456" rx="12"/>
<text class="h" x="710" y="94">OGS API</text>
<text class="t" x="710" y="114">Cloudflare Workers</text>
<rect class="box" x="706" y="132" width="208" height="54" rx="8"/>
<text class="tk" x="720" y="155">Profiles and sign-in</text>
<text class="t" x="720" y="173">name, avatar, guest or Apple</text>
<rect class="box" x="706" y="196" width="208" height="54" rx="8"/>
<text class="tk" x="720" y="219">Catalogue</text>
<text class="t" x="720" y="237">your manifest and art kit</text>
<rect class="box" x="706" y="260" width="208" height="72" rx="8"/>
<text class="tk" x="720" y="283">Couch session</text>
<text class="t" x="720" y="301">a Durable Object: TV code,</text>
<text class="t" x="720" y="319">who is on the couch</text>
<rect class="box" x="706" y="342" width="208" height="54" rx="8"/>
<text class="tk" x="720" y="365">Game tokens</text>
<text class="t" x="720" y="383">ES256, JWKS for your server</text>
<rect class="box" x="706" y="406" width="208" height="54" rx="8"/>
<text class="tk" x="720" y="429">Push and client log</text>
<text class="t" x="720" y="447">your API key sends</text>
<!-- arrows -->
<path class="ln" d="M310 104 H690" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="lbl" x="350" y="98">profile, game token, cast</text>
<path class="lna" d="M290 180 C340 180 340 240 380 240" marker-start="url(#b)" marker-end="url(#b)"/>
<text class="lbl" x="322" y="226" text-anchor="middle">moves</text>
<path class="lna" d="M290 394 C340 394 340 322 380 322" marker-start="url(#b)" marker-end="url(#b)"/>
<text class="lbl" x="322" y="372" text-anchor="middle">state</text>
<path class="ln dash" d="M620 281 H690" marker-end="url(#a)"/>
<text class="lbl" x="655" y="273" text-anchor="middle">JWKS</text>
<path class="ln" d="M310 496 H690" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="lbl" x="350" y="490">launcher: couch session, game token, catalogue</text>

</svg>

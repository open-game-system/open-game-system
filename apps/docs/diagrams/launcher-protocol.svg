<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc">
<title id="title">The launcher protocol: ogs:start, ogs:ready, ogs:room, ogs:resume-point, ogs:suspend and ogs:resume</title>
<desc id="desc">The sequence of postMessage messages between the OGS TV launcher and your TV page over one sitting.</desc>
<style>
svg{--bg:#f6f4ef;--paper:#fffdf9;--ink:#1b1a1f;--ink2:#5b5864;--line:#d9d4c8;--accent:#c2410c;--soft:#fdebe1;--cool:#e6eef0;--coolink:#1f5560}
@media (prefers-color-scheme: dark){svg{--bg:#131217;--paper:#1a1920;--ink:#ece9e2;--ink2:#a9a5b2;--line:#3a3743;--accent:#fb923c;--soft:#33221a;--cool:#17282c;--coolink:#8fd0dc}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.canvas{fill:var(--paper);stroke:var(--line);stroke-width:1}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.75}
.cool{fill:var(--cool);stroke:var(--coolink);stroke-width:1.5}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.h2{font-size:12px;font-weight:700;fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.t{font-size:13px;fill:var(--ink2)}
.tk{font-size:13px;fill:var(--ink)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--ink)}
.ma{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--accent);font-weight:600}
.lbl{font-size:12px;font-weight:600;fill:var(--accent);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}
.lna{stroke:var(--accent);stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 5}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:2 6;fill:none}
.ah{fill:var(--ink2)}
.aha{fill:var(--accent)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="659" rx="16"/>
<rect class="box" x="35" y="24" width="190" height="44" rx="10"/><text class="h" x="130" y="51" text-anchor="middle">Couch phones</text>
<path class="life" d="M130 68 V630"/>
<rect class="box" x="355" y="24" width="190" height="44" rx="10"/><text class="h" x="450" y="51" text-anchor="middle">OGS TV launcher</text>
<path class="life" d="M450 68 V630"/>
<rect class="hot" x="715" y="24" width="190" height="44" rx="10"/><text class="h" x="810" y="51" text-anchor="middle">Your TV page</text>
<path class="life" d="M810 68 V630"/>
<path class="ln" d="M134 108 H446" marker-end="url(#a)"/>
<text class="tk" x="290.0" y="100" text-anchor="middle">picks your game</text>
<path class="ln dash" d="M454 146 H806" marker-end="url(#a)"/>
<text class="tk" x="630.0" y="138" text-anchor="middle">loads your TV page in an iframe</text>
<path class="lna" d="M454 184 H806" marker-end="url(#b)"/>
<text class="ma" x="630.0" y="176" text-anchor="middle">ogs:start</text>
<text class="t" x="630.0" y="202" text-anchor="middle">instanceId, mode, roster, token, players</text>
<path class="lna" d="M806 232 H454" marker-end="url(#b)"/>
<text class="ma" x="630.0" y="224" text-anchor="middle">ogs:ready</text>
<text class="t" x="630.0" y="250" text-anchor="middle">your page started listening late</text>
<path class="lna" d="M454 280 H806" marker-end="url(#b)"/>
<text class="ma" x="630.0" y="272" text-anchor="middle">ogs:start</text>
<text class="t" x="630.0" y="298" text-anchor="middle">sent again for the current sitting</text>
<path class="lna" d="M806 328 H454" marker-end="url(#b)"/>
<text class="ma" x="630.0" y="320" text-anchor="middle">ogs:room</text>
<text class="t" x="630.0" y="346" text-anchor="middle">room games: the other phones follow</text>
<path class="lna" d="M806 376 H454" marker-end="url(#b)"/>
<text class="ma" x="630.0" y="368" text-anchor="middle">ogs:resume-point</text>
<text class="t" x="630.0" y="394" text-anchor="middle">label, e.g. “Mission 6”</text>
<path class="ln dash" d="M446 424 H134" marker-end="url(#a)"/>
<text class="tk" x="290.0" y="416" text-anchor="middle">Playing shows the label</text>
<path class="ln" d="M134 462 H446" marker-end="url(#a)"/>
<text class="tk" x="290.0" y="454" text-anchor="middle">Home</text>
<path class="lna" d="M454 500 H806" marker-end="url(#b)"/>
<text class="ma" x="630.0" y="492" text-anchor="middle">ogs:suspend</text>
<text class="t" x="630.0" y="518" text-anchor="middle">parked, still loaded: go silent</text>
<path class="ln" d="M134 548 H446" marker-end="url(#a)"/>
<text class="tk" x="290.0" y="540" text-anchor="middle">Continue</text>
<path class="lna" d="M454 586 H806" marker-end="url(#b)"/>
<text class="ma" x="630.0" y="578" text-anchor="middle">ogs:resume</text>
<text class="t" x="630.0" y="604" text-anchor="middle">same frame back, no reload</text>
</svg>

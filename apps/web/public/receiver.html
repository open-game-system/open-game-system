<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGS Cast Receiver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #status-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      transition: opacity 0.3s;
    }

    #status-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text {
      font-size: 18px;
      color: rgba(255,255,255,0.8);
      max-width: 80vw;
      text-align: center;
      line-height: 1.4;
    }

    /* A laptop's canvas cast: the game's HUD page, transparent, over the 16:9 picture (letterboxed like the video). */
    #hud {
      position: fixed;
      inset: 0;
      margin: auto;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      border: 0;
      background: transparent;
      color-scheme: normal;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="stream-video" autoplay playsinline muted></video>
  </div>

  <div id="status-overlay">
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="status-text">Connecting to game stream...</div>
  </div>

  <!-- Google Cast receiver SDK: lets the sender app tell us which game page to stream. -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    /**
     * OGS Cast Receiver
     *
     * Minimal receiver page for Chromecast/AirPlay.
     * Uses Cloudflare Realtime SFU via the OGS API for WebRTC streaming.
     * No PeerJS — all signaling goes through the backend.
     *
     * Launch params (URL query string):
     *   streamServerUrl — Base URL of the OGS API or stream server
     *   viewUrl         — URL to render on the stream server
     *   publisherSessionId — SFU publisher session ID (if already started)
     *
     * Legacy params:
     *   streamUrl       — Alias for streamServerUrl
     *
     * Sender messages (urn:x-cast:org.opengame.view):
     *   LOAD_VIEW {viewUrl, streamServerUrl} — the cloud renders viewUrl on a GPU and streams it (phones).
     *   PEER_OFFER {sdp, iceServers, hudUrl?} — a laptop streams its picture straight to this TV over
     *                                          WebRTC; we reply PEER_ANSWER {sdp} (or PEER_ERROR, also
     *                                          later if the link fails or no picture arrives in time).
     *                                          With `hudUrl` (a canvas cast) the laptop sends only its 3D
     *                                          scene, and we draw that page (the game's HUD, transparent)
     *                                          in an iframe on top of the video.
     *   HUD_MESSAGE {data}                   — forwarded to the HUD iframe (postMessage); the last one is
     *                                          re-sent when the iframe says HUD_READY.
     *   PEER_STOP                            — the laptop stopped streaming.
     *   GET_STATE                            — diagnostics (includes the HUD iframe's state).
     * To senders: REQUEST_VIEW {accepts: ['view', 'peer', 'peer-canvas']} until an offer or view arrives.
     * A failure never stops this app (that sends the TV back to its home screen): it shows what went
     * wrong and tells the sender, which may retry or switch to the cloud view.
     * ?signal=test replaces Cast messaging with window.__ogsSignalIn/__ogsSignalOut (desktop tests).
     */

    // Starting a stream (cloud browser launch + page load + SFU) takes ~45–90s; only give up well after that.
    const CONNECTION_TIMEOUT_MS = 120000;

    // DOM elements
    const video = document.getElementById('stream-video');
    const overlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');

    // State
    let pc = null;
    let connectionTimer = null;
    let isConnected = false;

    const VIEW_NAMESPACE = 'urn:x-cast:org.opengame.view';
    const DEFAULT_STREAM_SERVER = 'https://opengame-api-pr-5.jonathanrmumm.workers.dev/api/v1/stream';
    const DEFAULT_VIEW_URL = 'https://triviajam.tv';
    /** How long to wait for the sender to say what to show before falling back to the default. */
    const VIEW_WAIT_MS = 8000;
    const PLAYOUT_BUFFER_MS = 200;
    const PEER_PLAYOUT_BUFFER_MS = 60;
    const NO_SENDER_STOP_MS = 20 * 60 * 1000;
    const MAX_CAST_MS = 3 * 60 * 60 * 1000;
    let receiverSupports = null;

    /** URL params (for direct testing) override everything; otherwise the sender's LOAD_VIEW decides. */
    let launch = null;
    function getLaunchParams() {
      if (launch) return launch;
      const params = new URLSearchParams(window.location.search);
      return {
        streamServerUrl: params.get('streamServerUrl') || params.get('streamUrl') || DEFAULT_STREAM_SERVER,
        viewUrl: params.get('viewUrl') || DEFAULT_VIEW_URL,
        publisherSessionId: params.get('publisherSessionId') || '',
      };
    }

    /**
     * Debugging: mirror receiver logs and status back to whoever cast us (the OGS app or a CLI),
     * so a TV's view of each step is visible without remote-debugging the device.
     */
    let castContext = null;
    function tellSenders(payload) {
      try {
        if (castContext) castContext.sendCustomMessage('urn:x-cast:org.opengame.view', undefined, payload);
      } catch (e) { /* no senders yet */ }
    }
    for (const level of ['log', 'warn', 'error']) {
      const original = console[level].bind(console);
      console[level] = (...args) => {
        original(...args);
        tellSenders({ type: 'LOG', level, message: args.map((a) => (typeof a === 'string' ? a : JSON.stringify(a))).join(' ') });
      };
    }

    function setStatus(text, showSpinner = true) {
      tellSenders({ type: 'STATUS', status: text });
      statusText.textContent = text;
      spinner.style.display = showSpinner ? 'block' : 'none';
      // Once the stream is up, late setup steps must not cover the playing video (the connection
      // can come up before ICE gathering finishes). Failures clear isConnected first, so they still show.
      if (!isConnected) overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }
    // Video on screen is the truth: whenever it starts playing, nothing may cover it.
    video.addEventListener('playing', () => {
      isConnected = true;
      clearPeerTimer();
      if (currentViewUrl === 'laptop') console.log('[Receiver] Laptop picture playing', video.videoWidth + 'x' + video.videoHeight);
      hideOverlay();
    });

    function startConnectionTimeout() {
      connectionTimer = setTimeout(() => {
        if (!isConnected) {
          setStatus('Connection timed out', false);
          cleanup();
        }
      }, CONNECTION_TIMEOUT_MS);
    }

    function clearConnectionTimeout() {
      if (connectionTimer) {
        clearTimeout(connectionTimer);
        connectionTimer = null;
      }
    }

    // Heartbeat: keeps the stream server up for as long as this TV is casting. The video goes to
    // the SFU, not through the server, so without pings it looks idle mid-game; when the cast ends
    // the pings stop and the (GPU) server can scale to zero about 15 minutes later.
    const HEARTBEAT_MS = 60000;
    let heartbeatTimer = null;
    function startHeartbeat(baseUrl, streamSessionId) {
      stopHeartbeat();
      heartbeatTimer = setInterval(() => {
        fetch(`${baseUrl}/heartbeat`, { method: 'POST', headers: { 'x-stream-session-id': streamSessionId } })
          .then((res) => {
            // 410: the server ended a stream that ran past its maximum lifetime. Stop pinging (so the
            // GPU can scale to zero) and close the receiver on the TV.
            if (res.status !== 410) return;
            stopHeartbeat();
            setStatus('This TV session has ended', false);
            if (castContext) castContext.stop();
          })
          .catch((e) => console.warn('[Receiver] heartbeat failed', e));
      }, HEARTBEAT_MS);
    }
    function stopHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }

    function cleanup() {
      clearConnectionTimeout();
      stopHeartbeat();
      if (pc) {
        pc.close();
        pc = null;
      }
    }

    /** Plays incoming tracks (from the SFU or straight from a laptop) in the <video>. */
    function attachTrack(event) {
      console.log('[Receiver] Received remote track:', event.track.kind);
      // Playout buffer so a packet retransmitted after Wi-Fi loss arrives in time (see ?buffer=).
      // A laptop on the same Wi-Fi retransmits in a few ms, so its stream needs far less buffer.
      const defaultMs = currentViewUrl === 'laptop' ? PEER_PLAYOUT_BUFFER_MS : PLAYOUT_BUFFER_MS;
      const bufferMs = Number(new URLSearchParams(location.search).get('buffer') ?? defaultMs);
      if ('jitterBufferTarget' in event.receiver) event.receiver.jitterBufferTarget = bufferMs;
      else if ('playoutDelayHint' in event.receiver) event.receiver.playoutDelayHint = bufferMs / 1000;
      receiverSupports = { jitterBufferTarget: 'jitterBufferTarget' in event.receiver, playoutDelayHint: 'playoutDelayHint' in event.receiver };
      // A laptop's tracks arrive with its offer, before any picture can: keep "Connecting to the laptop"
      // up until the video actually plays (the 'playing' handler), never a black screen meanwhile.
      const fromLaptop = currentViewUrl === 'laptop';
      if (!fromLaptop) {
        clearConnectionTimeout();
        isConnected = true;
      }

      // Only set srcObject once — multiple tracks arrive rapidly
      if (!video.srcObject) {
        video.srcObject = event.streams[0] || new MediaStream([event.track]);
        // Starts muted (autoplay rules), then unmutes: the game's sound rides in this stream.
        // Cast devices allow unmuted playback; if a browser refuses, stay muted rather than stop.
        video.play()
          .then(() => { video.muted = false; return video.play(); })
          .catch(e => { console.warn('[Receiver] Unmuted play refused, staying muted:', e); video.muted = true; video.play().catch(() => {}); });
      } else if (event.track.kind === 'audio' && video.srcObject instanceof MediaStream) {
        // Add audio track to existing stream
        video.srcObject.addTrack(event.track);
      }
      if (!fromLaptop) hideOverlay();
    }

    function newPeerConnection(iceServers) {
      const conn = new RTCPeerConnection({ iceServers });
      window.receiverPc = conn; // for stream checks (inbound audio/video stats)
      conn.ontrack = attachTrack;
      conn.onconnectionstatechange = () => {
        console.log('[Receiver] Connection state:', conn.connectionState);
        if (conn !== pc) return;
        if (conn.connectionState === 'connected') {
          isConnected = true;
          hideOverlay();
        } else if (currentViewUrl === 'laptop') {
          onPeerConnectionState(conn.connectionState);
        } else if (conn.connectionState === 'disconnected' || conn.connectionState === 'failed') {
          isConnected = false;
          // 'disconnected' can recover on its own; only a failed connection ends the heartbeat.
          if (conn.connectionState === 'failed') stopHeartbeat();
          setStatus('Cast session ended', false);
        }
      };
      return conn;
    }

    // ── The HUD of a laptop's canvas cast: the game's own overlay page, in an iframe over the video ──
    let hudFrame = null;
    let hudOrigin = null;
    let hudState = null;
    let lastHudData = null;
    function showHud(url) {
      let parsed = null;
      try { parsed = new URL(url); } catch (e) { /* not a URL */ }
      if (!parsed || (parsed.protocol !== 'https:' && parsed.protocol !== 'http:')) {
        console.warn('[Receiver] Ignoring HUD url', url);
        removeHud();
        return;
      }
      if (hudFrame && hudFrame.dataset.src === parsed.href) return; // same HUD (a re-offer): keep it
      removeHud();
      hudOrigin = parsed.origin;
      hudState = { url: parsed.href, loaded: false, loadMs: null, ready: false, last: null, startedAt: Date.now() };
      const frame = document.createElement('iframe');
      frame.id = 'hud';
      frame.dataset.src = parsed.href;
      // Scripts for the game's own page, but it can't navigate this receiver or open popups.
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      frame.setAttribute('allowtransparency', 'true');
      frame.addEventListener('load', () => {
        if (!hudState || frame !== hudFrame) return;
        hudState.loaded = true;
        hudState.loadMs = Date.now() - hudState.startedAt;
        console.log('[Receiver] HUD loaded in', hudState.loadMs, 'ms:', parsed.origin + parsed.pathname);
        postHud(lastHudData);
      });
      frame.src = parsed.href;
      hudFrame = frame;
      document.body.appendChild(frame);
      console.log('[Receiver] HUD:', parsed.origin + parsed.pathname);
    }
    function removeHud() {
      if (hudFrame) hudFrame.remove();
      hudFrame = null;
      hudOrigin = null;
      lastHudData = null;
    }
    function postHud(data) {
      if (!data || !hudFrame || !hudFrame.contentWindow || !hudOrigin) return;
      try { hudFrame.contentWindow.postMessage(data, hudOrigin); } catch (e) { console.warn('[Receiver] HUD post failed', e); }
    }
    // Messages from the HUD page: HUD_READY (send it the latest layout) and anything it reports
    // about what it shows (logged for senders, kept for GET_STATE: we can't look inside the iframe).
    window.addEventListener('message', (e) => {
      if (!hudFrame || e.source !== hudFrame.contentWindow || !hudState) return;
      const data = e.data;
      if (data && data.type === 'HUD_READY') {
        hudState.ready = true;
        postHud(lastHudData);
      }
      hudState.last = data;
      console.log('[Receiver] HUD says:', data);
    });

    // ── A laptop's stream (PEER_OFFER): timeouts and failures are shown and told to the laptop ──
    // A laptop on the same Wi-Fi connects in a few seconds; past this, something's in the way.
    const PEER_TIMEOUT_MS = 20000;
    let peerReply = null;
    let peerTimer = null;
    function clearPeerTimer() {
      if (peerTimer) clearTimeout(peerTimer);
      peerTimer = null;
    }
    function peerFailed(why, text) {
      clearPeerTimer();
      isConnected = false;
      console.error('[Receiver] Laptop stream failed:', why);
      setStatus(text, false);
      if (pc) { pc.close(); pc = null; }
      video.srcObject = null;
      if (peerReply) peerReply({ type: 'PEER_ERROR', message: why });
    }
    function onPeerConnectionState(state) {
      if (state === 'disconnected') {
        // Often a Wi-Fi blip that recovers by itself; 'failed' follows if it doesn't.
        isConnected = false;
        setStatus('Reconnecting to the laptop...');
      } else if (state === 'failed') {
        peerFailed('connection failed', "Lost the laptop's picture. Keep the laptop awake and on the same Wi-Fi as this TV; it will try again.");
      }
    }

    function iceGathered(conn, maxMs) {
      if (conn.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise((resolve) => {
        const check = () => {
          if (conn.iceGatheringState === 'complete') {
            conn.removeEventListener('icegatheringstatechange', check);
            resolve();
          }
        };
        conn.addEventListener('icegatheringstatechange', check);
        setTimeout(resolve, maxMs);
      });
    }

    /**
     * Laptop cast: a laptop's Chrome renders the game itself and streams its tab straight to this
     * TV (WebRTC over the LAN; TURN only as a fallback). No cloud browser, no GPU, no SFU: the offer
     * and answer travel over the Cast message channel. `reply` sends to the laptop that offered.
     */
    async function startPeer(offer, reply) {
      if (started) {
        cleanup();
        clearPeerTimer();
        video.srcObject = null;
      }
      isConnected = false;
      launch = null;
      started = true;
      currentViewUrl = 'laptop';
      peerReply = reply;
      console.log('[Receiver] Laptop stream offered', offer.hudUrl ? '(3D canvas + HUD)' : '(whole tab)');
      if (typeof offer.hudUrl === 'string') showHud(offer.hudUrl);
      else removeHud();
      setStatus('Connecting to the laptop...');
      const conn = newPeerConnection(Array.isArray(offer.iceServers) ? offer.iceServers : []);
      pc = conn;
      clearPeerTimer();
      peerTimer = setTimeout(() => {
        if (conn === pc && !isConnected) peerFailed('no picture after ' + PEER_TIMEOUT_MS / 1000 + 's', "The laptop's picture didn't arrive. Keep the laptop on the same Wi-Fi as this TV and cast again.");
      }, PEER_TIMEOUT_MS);
      try {
        await conn.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
        await conn.setLocalDescription(await conn.createAnswer());
        await iceGathered(conn, 2000);
        if (conn !== pc) return; // a newer offer replaced this one
        reply({ type: 'PEER_ANSWER', sdp: conn.localDescription.sdp });
      } catch (err) {
        if (conn !== pc) return;
        peerFailed(String(err && err.message || err), 'Unable to connect to the laptop');
      }
    }

    async function startReceiving() {
      const { streamServerUrl, viewUrl, publisherSessionId } = getLaunchParams();

      if (!streamServerUrl) {
        setStatus('Unable to connect to game stream', false);
        console.error('[Receiver] No streamServerUrl provided');
        return;
      }

      console.log('[Receiver] Stream server:', streamServerUrl);
      console.log('[Receiver] View URL:', viewUrl);
      console.log('[Receiver] Publisher session ID:', publisherSessionId);

      setStatus('Connecting to game stream...');
      startConnectionTimeout();

      try {
        const baseUrl = streamServerUrl.replace(/\/$/, '');

        // Step 1: Fetch ICE servers from stream server
        let iceServers = [{ urls: ['stun:stun.l.google.com:19302'] }];
        try {
          const iceEndpoint = `${baseUrl}/ice-servers`;
          const iceRes = await fetch(iceEndpoint);
          if (iceRes.ok) {
            const iceData = await iceRes.json();
            if (Array.isArray(iceData.iceServers)) {
              iceServers = iceData.iceServers;
              console.log('[Receiver] Got ICE servers from stream server:', iceServers);
            }
          }
        } catch (e) {
          console.log('[Receiver] Could not fetch ICE servers, using defaults');
        }

        // Step 2: If no publisherSessionId, start the stream first
        let pubSessionId = publisherSessionId;
        if (!pubSessionId && viewUrl) {
          setStatus('Starting stream...');
          // A session id gives this TV its own stream container (a fresh browser), instead of the
          // shared singleton that other casts may still be using.
          const streamSessionId = 'rx-' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
          console.log('[Receiver] Stream session:', streamSessionId);
          startHeartbeat(baseUrl, streamSessionId);
          const startRes = await fetch(`${baseUrl}/start-stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-stream-session-id': streamSessionId },
            body: JSON.stringify({ url: viewUrl })
          });

          if (!startRes.ok) {
            const errText = await startRes.text().catch(() => 'unknown error');
            throw new Error(`Start stream failed: ${startRes.status}: ${errText}`);
          }

          const startData = await startRes.json();
          console.log('[Receiver] Stream started:', startData);

          if (startData.status !== 'success' || !startData.publisherSessionId) {
            throw new Error(startData.error || 'Start stream returned no publisherSessionId');
          }

          pubSessionId = startData.publisherSessionId;
        }

        if (!pubSessionId) {
          throw new Error('No publisherSessionId available');
        }

        console.log('[Receiver] Using publisher session:', pubSessionId);
        setStatus('Subscribing to stream...');

        // Step 3: Subscribe to get SFU's SDP offer
        const subRes = await fetch(`${baseUrl}/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            publisherSessionId: pubSessionId,
            trackNames: ['cast-video', 'cast-audio']
          })
        });

        if (!subRes.ok) {
          const errText = await subRes.text().catch(() => 'unknown error');
          throw new Error(`Subscribe failed: ${subRes.status}: ${errText}`);
        }

        const subData = await subRes.json();
        console.log('[Receiver] Subscribed, got SFU offer');
        const { subscriberSessionId, sessionDescription: sfuOffer } = subData;

        // Step 4: Create RTCPeerConnection and set remote offer
        pc = newPeerConnection(iceServers);

        // Set the SFU's offer as remote description
        await pc.setRemoteDescription(new RTCSessionDescription(sfuOffer));

        // Create answer and wait for ICE gathering to complete
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        // Wait for ICE candidates to be gathered (needed for TURN/relay). Timeout after 5s — send what we have
        await iceGathered(pc, 5000);

        // Use the final local description (includes gathered ICE candidates)
        const finalAnswer = pc.localDescription;

        // Step 5: Send answer back to backend
        setStatus('Establishing connection...');
        const answerRes = await fetch(`${baseUrl}/subscribe/${subscriberSessionId}/answer`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionDescription: {
              type: finalAnswer.type,
              sdp: finalAnswer.sdp
            }
          })
        });

        if (!answerRes.ok) {
          const errText = await answerRes.text().catch(() => 'unknown error');
          throw new Error(`Answer failed: ${answerRes.status}: ${errText}`);
        }

        console.log('[Receiver] Answer sent, waiting for media...');
        // Only show waiting status if tracks haven't arrived yet
        if (!isConnected) {
          setStatus('Waiting for video stream...');
        }

      } catch (err) {
        console.error('[Receiver] Failed to start stream:', err);
        clearConnectionTimeout();
        setStatus('Unable to connect to game stream', false);
      }
    }

    async function reportState(senderId) {
      const state = {
        type: 'STATE', started, viewUrl: currentViewUrl, status: statusText ? statusText.textContent : null,
        overlayVisible: !overlay.classList.contains('hidden'),
        receiverSupports, userAgent: navigator.userAgent,
        video: { width: video.videoWidth, height: video.videoHeight, readyState: video.readyState, paused: video.paused,
          muted: video.muted, currentTime: video.currentTime, error: video.error ? video.error.code : null,
          tracks: video.srcObject ? video.srcObject.getTracks().map((t) => `${t.kind}:${t.readyState}${t.muted ? ':muted' : ''}`) : [] },
        pc: pc ? { connection: pc.connectionState, ice: pc.iceConnectionState } : null,
        hud: hudFrame && hudState ? { url: hudState.url, loaded: hudState.loaded, loadMs: hudState.loadMs, ready: hudState.ready, last: hudState.last, layout: lastHudData,
          box: (() => { const r = hudFrame.getBoundingClientRect(); return `${Math.round(r.width)}x${Math.round(r.height)}@${Math.round(r.left)},${Math.round(r.top)}`; })() } : null,
        screen: `${window.innerWidth}x${window.innerHeight}@${window.devicePixelRatio}`,
        inbound: {},
      };
      if (pc) {
        (await pc.getStats()).forEach((r) => {
          if (r.type === 'inbound-rtp') state.inbound[r.kind] = { bytes: r.bytesReceived, packets: r.packetsReceived, lost: r.packetsLost,
            framesDecoded: r.framesDecoded, framesDropped: r.framesDropped, keyFrames: r.keyFramesDecoded, fps: r.framesPerSecond,
            decoder: r.decoderImplementation, size: r.frameWidth ? `${r.frameWidth}x${r.frameHeight}` : undefined, energy: r.totalAudioEnergy,
            freezes: r.freezeCount, freezeSeconds: r.totalFreezesDuration, pauses: r.pauseCount, pauseSeconds: r.totalPausesDuration,
            jitterMs: r.jitter != null ? Math.round(r.jitter * 1000) : undefined, nacks: r.nackCount, plis: r.pliCount,
            bufferMs: r.jitterBufferEmittedCount ? Math.round((r.jitterBufferDelay / r.jitterBufferEmittedCount) * 1000) : undefined };
          if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') state.path = { rttMs: Math.round((r.currentRoundTripTime || 0) * 1000), inKbps: Math.round((r.availableIncomingBitrate || 0) / 1000) };
        });
      }
      try { castContext.sendCustomMessage(VIEW_NAMESPACE, senderId, state); } catch (e) { console.warn('[Receiver] STATE send failed', e); }
    }

    let started = false;
    let currentViewUrl = null;
    function begin(params) {
      if (started && params.viewUrl === currentViewUrl) return;
      if (started) {
        cleanup();
        isConnected = false;
        video.srcObject = null;
      }
      launch = params;
      started = true;
      currentViewUrl = params.viewUrl;
      startReceiving();
    }

    /**
     * What this receiver can show: a page the cloud renders (LOAD_VIEW), a laptop's tab (PEER_OFFER),
     * or a laptop's 3D canvas with the game's HUD page drawn here on top (PEER_OFFER with hudUrl).
     */
    const ACCEPTS = ['view', 'peer', 'peer-canvas'];
    /** A sender has spoken to us: it is deciding what to show, so don't fall back to the default view. */
    let senderSpoke = false;

    /** One message from a sender on the view namespace; `reply` answers that sender only. */
    function onViewMessage(data, reply) {
      if (!data) return;
      senderSpoke = true;
      if (data.type === 'LOAD_VIEW' && data.viewUrl) {
        clearPeerTimer();
        peerReply = null;
        removeHud();
        begin({ viewUrl: data.viewUrl, streamServerUrl: data.streamServerUrl || DEFAULT_STREAM_SERVER, publisherSessionId: '' });
      } else if (data.type === 'PEER_OFFER' && typeof data.sdp === 'string') {
        startPeer(data, reply);
      } else if (data.type === 'HUD_MESSAGE' && currentViewUrl === 'laptop') {
        lastHudData = data.data;
        postHud(lastHudData);
      } else if (data.type === 'PEER_STOP' && currentViewUrl === 'laptop') {
        cleanup();
        clearPeerTimer();
        peerReply = null;
        removeHud();
        isConnected = false;
        video.srcObject = null;
        console.log('[Receiver] The laptop stopped casting');
        setStatus('The laptop stopped casting', false);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const hasCast = typeof cast !== 'undefined' && cast.framework;
    if (urlParams.get('signal') === 'test') {
      // Desktop testing of a laptop cast without a Chromecast: a test harness relays messages through
      // window.__ogsSignalIn (to this page) and window.__ogsSignalOut (from it), standing in for Cast.
      const out = (payload) => { if (typeof window.__ogsSignalOut === 'function') window.__ogsSignalOut(payload); };
      window.__ogsSignalIn = (data) => onViewMessage(typeof data === 'string' ? JSON.parse(data) : data, out);
      const askTimer = setInterval(() => (started ? clearInterval(askTimer) : out({ type: 'REQUEST_VIEW', accepts: ACCEPTS })), 500);
      setStatus('Waiting for the game...');
    } else if (urlParams.get('viewUrl') || !hasCast) {
      // Opened directly (testing), or not on a Cast device.
      begin(getLaunchParams());
    } else {
      const context = cast.framework.CastReceiverContext.getInstance();
      castContext = context;
      context.addCustomMessageListener(VIEW_NAMESPACE, (event) => {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        // (Offers carry kilobytes of SDP and HUD messages are frequent: log only what they are.)
        if (data && (data.type === 'PEER_OFFER' || data.type === 'HUD_MESSAGE')) console.log('[Receiver] From sender:', data.type);
        else console.log('[Receiver] LOAD_VIEW from sender:', data);
        if (data && data.type === 'GET_STATE') {
          // Diagnostics for a sender: is the stream actually decoding video/audio on this device?
          reportState(event.senderId);
          return;
        }
        onViewMessage(data, (payload) => {
          try { context.sendCustomMessage(VIEW_NAMESPACE, event.senderId, payload); } catch (e) { console.warn('[Receiver] reply failed', e); }
        });
      });
      const options = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true; // we play a WebRTC stream, not Cast media
      options.customNamespaces = { [VIEW_NAMESPACE]: cast.framework.system.MessageType.JSON };
      // Handshake: the sender's first LOAD_VIEW can arrive before this page is listening (cold start),
      // so ask for the view once ready, when any sender connects, and keep asking until one arrives.
      const requestView = (senderId) => {
        if (started) return;
        // `accepts` lets a laptop sender stream its own tab instead of asking the cloud to render.
        try { context.sendCustomMessage(VIEW_NAMESPACE, senderId, { type: 'REQUEST_VIEW', accepts: ACCEPTS }); } catch (e) { /* no senders yet */ }
      };
      context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, (e) => requestView(e.senderId));
      // Never stream to an empty room: the cast keeps a cloud GPU running (and billing) until this
      // page closes. Stop 20 min after the last phone disconnects, and after 3 hours regardless.
      let noSenderTimer = null;
      context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
        clearTimeout(noSenderTimer);
        noSenderTimer = null;
      });
      context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
        if (context.getSenders().length > 0 || noSenderTimer) return;
        console.log('[Receiver] No phones connected; stopping in', NO_SENDER_STOP_MS / 60000, 'min');
        noSenderTimer = setTimeout(() => context.stop(), NO_SENDER_STOP_MS);
      });
      setTimeout(() => context.stop(), MAX_CAST_MS);
      const askTimer = setInterval(() => (started ? clearInterval(askTimer) : requestView(undefined)), 1500);
      context.start(options);
      setStatus('Waiting for the game...');
      setTimeout(() => {
        // Only when no sender has said anything: a laptop preparing its offer must not be overtaken
        // by the default page (which would also start a cloud stream).
        if (!started && !senderSpoke) begin(getLaunchParams());
      }, VIEW_WAIT_MS);
    }
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" role="img" aria-labelledby="title desc">
<title id="title">Who renders the TV: the host iPhone for AirPlay, the Chromecast itself, or a browser on the TV</title>
<desc id="desc">AirPlay: the iPhone draws. Chromecast: the Chromecast draws. Browser TV: the browser draws.</desc>
<style>
svg{--bg:#f6f4ef;--paper:#fffdf9;--ink:#1b1a1f;--ink2:#5b5864;--line:#d9d4c8;--accent:#c2410c;--soft:#fdebe1;--cool:#e6eef0;--coolink:#1f5560}
@media (prefers-color-scheme: dark){svg{--bg:#131217;--paper:#1a1920;--ink:#ece9e2;--ink2:#a9a5b2;--line:#3a3743;--accent:#fb923c;--soft:#33221a;--cool:#17282c;--coolink:#8fd0dc}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.canvas{fill:var(--paper);stroke:var(--line);stroke-width:1}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.75}
.cool{fill:var(--cool);stroke:var(--coolink);stroke-width:1.5}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.h2{font-size:12px;font-weight:700;fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.t{font-size:13px;fill:var(--ink2)}
.tk{font-size:13px;fill:var(--ink)}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--ink)}
.ma{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--accent);font-weight:600}
.lbl{font-size:12px;font-weight:600;fill:var(--accent);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}
.lna{stroke:var(--accent);stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 5}
.life{stroke:var(--line);stroke-width:2;stroke-dasharray:2 6;fill:none}
.ah{fill:var(--ink2)}
.aha{fill:var(--accent)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="canvas" x="0.5" y="0.5" width="399" height="799" rx="16"/>
<text class="h" x="20" y="42">Apple TV, through AirPlay</text>
<rect class="hot" x="20" y="56" width="360" height="74" rx="10"/>
<text class="tk" x="36" y="80">The host iPhone draws it</text>
<text class="t" x="36" y="100">on the external display iOS makes</text>
<text class="t" x="36" y="118">for Screen Mirroring</text>
<path class="lna" d="M200 130 V170" marker-end="url(#b)"/>
<text class="lbl" x="212" y="155">Screen Mirroring (video)</text>
<rect class="box" x="20" y="170" width="360" height="56" rx="10"/>
<text class="tk" x="36" y="194">Apple TV shows the picture</text>
<text class="t" x="36" y="213">phone stays in front and awake</text>
<text class="h" x="20" y="286">Chromecast</text>
<rect class="box" x="20" y="300" width="360" height="56" rx="10"/>
<text class="tk" x="36" y="324">The host phone sends a URL</text>
<text class="t" x="36" y="343">the TV launcher (LOAD_VIEW)</text>
<path class="lna" d="M200 356 V396" marker-end="url(#b)"/>
<text class="lbl" x="212" y="381">Google Cast</text>
<rect class="hot" x="20" y="396" width="360" height="74" rx="10"/>
<text class="tk" x="36" y="420">The Chromecast draws it</text>
<text class="t" x="36" y="440">the OGS receiver runs the launcher;</text>
<text class="t" x="36" y="458">light tier on weak models</text>
<text class="h" x="20" y="530">TV or laptop browser</text>
<rect class="box" x="20" y="544" width="360" height="56" rx="10"/>
<text class="tk" x="36" y="568">A phone pairs by a code</text>
<text class="t" x="36" y="587">shown at ogs-tv.pages.dev</text>
<path class="lna" d="M200 600 V640" marker-end="url(#b)"/>
<text class="lbl" x="212" y="625">OGS API</text>
<rect class="hot" x="20" y="640" width="360" height="56" rx="10"/>
<text class="tk" x="36" y="664">The TV's browser draws it</text>
<text class="t" x="36" y="683">launcher and your TV page</text>
<text class="t" x="20" y="740">Highlighted: the device that renders</text>
<text class="t" x="20" y="758">your TV page. No cloud GPU, no server</text>
<text class="t" x="20" y="776">video stream on any path.</text>

</svg>
